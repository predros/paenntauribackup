<html lang="en">

      src: url("assets/fonts/Roboto-Medium.ttf");

    body {
      font-family: "Roboto", sans-serif;
      overflow: hidden;
      padding: 0;

    .container {

      left: 50%;

      transform: translate(-50%, -50%);
    }

    <div class="container">
      <span class="text"> Loading... </span>
